# Render Blueprint for the SWE 573 prototype.
#
# Dashboard: New → Blueprint, pick this repo and the branch that contains
# this file. Render creates one free web service and one free Postgres
# database. Both are in Frankfurt so the site can use the database's
# private URL (they have to be in the same region).
#
# The database password is generated by Render and injected as DATABASE_URL.
# It is not written in this file. See README.md for the click-by-click steps
# and docs/adr/007-deploy.md for why this is Postgres and not SQLite.

services:
  - type: web
    name: indigenous-crafts
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: indigenous-crafts-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "1"
      # Public test account, the same one as the local default. Not a secret.
      # To use a different login, change these in the Render dashboard before
      # the first successful boot (seed will not reset an existing user).
      - key: DEMO_EMAIL
        value: atakan@example.com
      - key: DEMO_PASSWORD
        value: password

databases:
  - name: indigenous-crafts-db
    plan: free
    region: frankfurt
    databaseName: crafts
    user: crafts
