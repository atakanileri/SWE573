# One service is enough for the prototype: FastAPI serves the pages and the API,
# and SQLite is just a file. The named volume keeps that file when the
# container is recreated.

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/crafts.db
      SEED_DEMO_DATA: "1"
    volumes:
      - craft-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  craft-data:
